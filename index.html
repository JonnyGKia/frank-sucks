<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Frank Sucks">
<meta name="application-name" content="Frank Sucks">
<title>Private</title>
<style>
  :root { --bg: #1b1206; --fg: #fff4dc; --accent: #9ccc3c; }
  html, body { margin: 0; height: 100%; background: radial-gradient(800px 500px at 50% 40%, #3a2810, var(--bg)); color: var(--fg); font-family: "Arial Black", Arial, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  form { width: min(340px, 100%); text-align: center; }
  .lock { font-size: 54px; }
  h1 { font-size: 22px; margin: 8px 0 18px; letter-spacing: .04em; }
  input[type=password] { width: 100%; box-sizing: border-box; font: 600 18px Arial, sans-serif; padding: 14px 16px; border-radius: 14px; border: 2px solid #5a4520; background: #120c04; color: var(--fg); outline: none; }
  input[type=password]:focus { border-color: var(--accent); }
  label.rem { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0; font: 600 14px Arial, sans-serif; color: #c9b48a; }
  button { width: 100%; font: 900 18px "Arial Black", Arial, sans-serif; padding: 14px; border-radius: 999px; border: 0; background: var(--accent); color: #1b1206; cursor: pointer; box-shadow: 0 6px 0 #4d6b12; }
  button:disabled { opacity: .6; }
  .err { min-height: 22px; margin-top: 12px; font: 700 15px Arial, sans-serif; color: #ff8a6b; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="lock">🔒</div>
  <h1>PRIVATE PAGE</h1>
  <input type="password" id="pw" placeholder="Password" autocomplete="off" autofocus>
  <button id="go" type="submit">ENTER</button>
  <div class="err" id="err"></div>
</form>
<script>
var DATA = null;   // the encrypted page is always fetched fresh, so updates show up right away
var KEY = 'frank-pw';
function bytes(b) { var s = atob(b), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
// page.bin = "FRK1" + salt(16) + iv(12) + AES-GCM ciphertext of the gzipped page. Browsers that can't unzip get page.json instead.
var ZIP = typeof DecompressionStream === 'function';
async function load() {
  var res = await fetch((ZIP ? 'page.bin' : 'page.json') + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('load');
  if (!ZIP) { var j = await res.json(); return { salt: bytes(j.salt), iv: bytes(j.iv), ct: bytes(j.ct) }; }
  var u = new Uint8Array(await res.arrayBuffer());
  if (String.fromCharCode(u[0], u[1], u[2], u[3]) !== 'FRK1') throw new Error('load');
  return { salt: u.slice(4, 20), iv: u.slice(20, 32), ct: u.slice(32) };
}
async function unlock(pw) {
  if (!DATA) DATA = await load();
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: DATA.salt, iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: DATA.iv }, key, DATA.ct); } catch (e) { throw new Error('pw'); }
  if (!ZIP) return new TextDecoder().decode(plain);
  return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function show(html) { document.open(); document.write(html); document.close(); }
async function tryPw(pw, silent) {
  var btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'UNLOCKING...'; err.textContent = '';
  try {
    var html = await unlock(pw);
    show(html);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'ENTER';
    if (e && e.message !== 'pw') DATA = null;              // a failed download gets retried next time
    if (!silent) err.textContent = e && e.message === 'pw' ? 'Wrong password' : 'Couldn\'t load. Check your connection and try again.';
  }
}
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  tryPw(document.getElementById('pw').value, false);
});
// The password is never remembered: wipe anything an older version of this page saved, every time it loads.
try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {}
// If the browser restores this page from its back/forward cache, reload so the lock shows again.
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
</script>
</body>
</html>
